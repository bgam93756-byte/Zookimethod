<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Zookimethod — Full Quality</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Zookimethod</span>
    <div class="topbar-actions">
      <button id="sound-btn" class="pill" type="button" aria-pressed="false" aria-label="Sound off">🔇</button>
      <button id="stats-btn" class="pill" type="button" aria-pressed="false">Stats</button>
      <label id="play-file-label" class="pill pill-accent" for="file-input">＋ Play file</label>
      <button id="upload-btn" class="pill pill-accent" type="button" hidden>＋ Upload</button>
      <input id="file-input" type="file" accept="video/*" multiple hidden>
    </div>
  </header>

  <main id="feed" class="feed" aria-label="Video feed"></main>

  <template id="slide-template">
    <section class="slide">
      <video playsinline loop muted preload="none" disableremoteplayback></video>
      <div class="badge" aria-live="polite"></div>
      <div class="lag-warning" hidden></div>
      <div class="caption">
        <h2 class="title"></h2>
        <p class="text"></p>
      </div>
      <div class="side-actions">
        <button class="icon-btn fullscreen-btn" type="button" aria-label="Fullscreen">⛶</button>
      </div>
      <dl class="stats" hidden></dl>
      <div class="tap-hint" hidden>Tap to play</div>
    </section>
  </template>

  <template id="empty-template">
    <section class="slide empty">
      <div class="empty-card">
        <h1>No compression. No downscaling.</h1>
        <p>Videos here play from the exact file that was recorded: full 4K, full 120&nbsp;fps, full bitrate. If your phone can't keep up, it lags for real.</p>
        <p>Try one of your own videos. It plays straight from your device and is never uploaded.</p>
        <label class="pill pill-accent big" for="file-input">＋ Play a video from this device</label>
      </div>
    </section>
  </template>

  <dialog id="upload-dialog" class="sheet" aria-labelledby="upload-heading">
    <div class="sheet-head">
      <h2 id="upload-heading">Upload</h2>
      <button class="icon-btn sheet-close" type="button" aria-label="Close">✕</button>
    </div>
    <form id="upload-form" novalidate>
      <label class="file-pick" for="upload-file">
        <span id="upload-file-name">Choose a video</span>
        <span id="upload-file-info" class="muted"></span>
      </label>
      <input id="upload-file" type="file" accept="video/*" hidden>
      <label class="field-label" for="upload-title">Title</label>
      <input id="upload-title" class="field" type="text" maxlength="150" autocomplete="off">
      <label class="field-label" for="upload-caption">Caption</label>
      <textarea id="upload-caption" class="field" maxlength="2200" rows="2"></textarea>
      <label class="switch" for="upload-enhance">
        <input id="upload-enhance" type="checkbox" checked>
        <span>
          <strong>Enhance to 4K 120fps</strong>
          <small>Upscales to 4K and adds in-between frames. Videos that are already 4K 120fps are posted exactly as they are.</small>
        </span>
      </label>
      <p id="upload-error" class="form-error" hidden></p>
      <div class="sheet-actions">
        <button class="pill pill-accent big" type="submit">Upload</button>
        <label id="upload-play-local" class="pill big" for="file-input">Just play it here</label>
      </div>
    </form>
    <ul id="upload-jobs" class="jobs" hidden></ul>
  </dialog>

  <template id="upload-job-template">
    <li class="job">
      <div class="job-row">
        <strong class="job-title"></strong>
        <span class="job-stage"></span>
      </div>
      <progress max="1" value="0"></progress>
      <p class="job-detail muted"></p>
      <div class="job-actions">
        <button class="pill job-cancel" type="button" hidden>Cancel</button>
        <button class="pill pill-accent job-watch" type="button" hidden>Watch it</button>
        <label class="pill pill-accent job-resume" hidden>Resume…<input type="file" accept="video/*" hidden></label>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
  <script src="upload.js"></script>
</body>
</html>
